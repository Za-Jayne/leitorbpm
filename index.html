
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leitor BPM</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f4f6f8;
      color: #202124;
    }
    main {
      max-width: 520px;
      margin: auto;
      background: white;
      padding: 18px;
      border-radius: 12px;
    }
    h2 { color: #174ea6; }
    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: 0;
      border-radius: 8px;
      background: #174ea6;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }
    button:disabled { opacity: 0.6; }
    #leitor { margin-top: 16px; }
    #mensagem {
      margin-top: 12px;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
<main>
  <h2>Leitor de BPM</h2>
  <p>Toque no botão e aponte a câmera para o código de barras do patrimônio.</p>

  <button id="iniciar" onclick="iniciarLeitor()">Abrir câmera</button>
  <div id="leitor"></div>
  <div id="mensagem" aria-live="polite">Aguardando início.</div>
  <button id="parar" onclick="pararLeitor()" hidden>Fechar câmera</button>
</main>

<script>
  const APP_URL =
    "https://script.google.com/macros/s/AKfycbwtc7P8xFefVvwFSMQHxDcGs-K4aWwbBwTrdyI5qH2JmoNIIhK1t5DbpdecyuXexLoVuQ/exec";

  let leitor = null;
  let ocupado = false;
  let codigoProcessado = false;

  const mensagem = document.getElementById("mensagem");
  const botaoIniciar = document.getElementById("iniciar");
  const botaoParar = document.getElementById("parar");

  async function iniciarLeitor() {
    if (ocupado) return;

    if (!window.isSecureContext) {
      mensagem.textContent =
        "A câmera exige uma página HTTPS segura.";
      return;
    }

    if (typeof Html5Qrcode === "undefined") {
      mensagem.textContent =
        "Biblioteca de leitura indisponível. Verifique a internet e recarregue a página.";
      return;
    }

    ocupado = true;
    codigoProcessado = false;
    botaoIniciar.disabled = true;
    mensagem.textContent = "Verificando câmeras disponíveis...";

    try {
      leitor = new Html5Qrcode("leitor");

      // Solicita as câmeras disponíveis e identifica a traseira.
      const cameras = await Html5Qrcode.getCameras();

      if (!cameras || cameras.length === 0) {
        throw new Error(
          "Nenhuma câmera foi encontrada. Confira as permissões do Chrome."
        );
      }

      const cameraTraseira =
        cameras.find(c => /back|rear|environment|traseira/i.test(c.label))
        || cameras[cameras.length - 1];

      mensagem.textContent = "Solicitando acesso à câmera...";

      await leitor.start(
        cameraTraseira.id,
        {
          fps: 10,
          qrbox: { width: 280, height: 120 }
        },
        async (codigo) => {
          if (codigoProcessado) return;

          const bpm = String(codigo || "").trim();
          if (!bpm) return;

          codigoProcessado = true;
          mensagem.textContent =
            "Código lido: " + bpm + ". Abrindo pesquisa...";

          await pararLeitor();

          // Redireciona somente depois de ler o código.
          window.location.href =
            APP_URL + "?bpm=" + encodeURIComponent(bpm);
        },
        () => {}
      );

      mensagem.textContent =
        "Câmera ativa. Posicione o código de barras na área de leitura.";
      botaoParar.hidden = false;

    } catch (erro) {
      if (leitor) {
        try {
          if (leitor.isScanning) await leitor.stop();
        } catch (e) {}

        try {
          leitor.clear();
        } catch (e) {}

        leitor = null;
      }

      ocupado = false;
      botaoIniciar.disabled = false;

      const detalhe = erro && erro.name
        ? erro.name + ": " + erro.message
        : String(erro);

      mensagem.textContent =
        "Falha ao iniciar a câmera. " + detalhe +
        ". Confira a permissão de câmera do site no Chrome.";
    }
  }

  async function pararLeitor() {
    if (leitor) {
      try {
        if (leitor.isScanning) await leitor.stop();
      } catch (e) {}

      try {
        leitor.clear();
      } catch (e) {}

      leitor = null;
    }

    botaoParar.hidden = true;
    botaoIniciar.disabled = false;
    ocupado = false;
  }
</script>
</body>
</html>
