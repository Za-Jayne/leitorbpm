<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leitor BPM</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f4f6f8;
      color: #202124;
    }
    main {
      max-width: 520px;
      margin: auto;
      background: white;
      padding: 18px;
      border-radius: 12px;
    }
    h2 { color: #174ea6; }
    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: 0;
      border-radius: 8px;
      background: #174ea6;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }
    #leitor { margin-top: 16px; }
    #mensagem {
      margin-top: 12px;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
<main>
  <h2>Leitor de BPM</h2>
  <p>Toque no botão e aponte a câmera para o código de barras do patrimônio.</p>

  <button id="iniciar" onclick="iniciarLeitor()">Abrir câmera</button>
  <div id="leitor"></div>
  <div id="mensagem" aria-live="polite">Aguardando início.</div>
  <button id="parar" onclick="pararLeitor()" hidden>Fechar câmera</button>
</main>

<script>
  // Aplicação patrimonial já publicada.
  const APP_URL =
    "https://script.google.com/macros/s/AKfycbwtc7P8xFefVvwFSMQHxDcGs-K4aWwbBwTrdyI5qH2JmoNIIhK1t5DbpdecyuXexLoVuQ/exec";

  let leitor = null;
  let ocupado = false;

  async function iniciarLeitor() {
    if (ocupado) return;

    if (typeof Html5Qrcode === "undefined") {
      document.getElementById("mensagem").textContent =
        "Não foi possível carregar a biblioteca. Verifique a internet.";
      return;
    }

    ocupado = true;
    document.getElementById("iniciar").disabled = true;
    document.getElementById("mensagem").textContent =
      "Solicitando acesso à câmera...";

    try {
      leitor = new Html5Qrcode("leitor");

      await leitor.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 260, height: 120 } },
        async (codigo) => {
          const bpm = String(codigo || "").trim();
          if (!bpm) return;

          document.getElementById("mensagem").textContent =
            "Código lido: " + bpm + ". Abrindo pesquisa...";

          await pararLeitor();

          window.location.href =
            APP_URL + "?bpm=" + encodeURIComponent(bpm);
        },
        () => {}
      );

      document.getElementById("mensagem").textContent =
        "Câmera ativa. Posicione o código de barras na área de leitura.";
      document.getElementById("parar").hidden = false;
    } catch (erro) {
      document.getElementById("mensagem").textContent =
        "Não foi possível abrir a câmera: " +
        (erro.message || erro);
      if (leitor) {
        try { leitor.clear(); } catch (e) {}
        leitor = null;
      }
      ocupado = false;
      document.getElementById("iniciar").disabled = false;
    }
  }

  async function pararLeitor() {
    if (leitor) {
      try {
        if (leitor.isScanning) await leitor.stop();
      } catch (e) {}

      try { leitor.clear(); } catch (e) {}
      leitor = null;
    }

    document.getElementById("parar").hidden = true;
  }
</script>
</body>
</html>
